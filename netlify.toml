# Netlify builds the app from the repo root, the same way Railway does.
# The sales page is a second Netlify site with Base directory = site (see site/netlify.toml).
[build]
command = "npm run build"
publish = "app/dist"

# License checks go to Lemon Squeezy from the app's own address (see app/src/lib/access.ts).
[[redirects]]
from = "/api/license"
to = "https://api.lemonsqueezy.com/v1/licenses/validate"
status = 200
force = true
